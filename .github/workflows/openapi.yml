name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN может только читать код
permissions:
  contents: read

jobs:
  # Что есть в репозитории. hashFiles() нельзя использовать в if на уровне джобы,
  # поэтому признаки считаются здесь и передаются через outputs
  detect:
    name: detect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      dockerfile: ${{ steps.files.outputs.dockerfile }}
      migrations: ${{ steps.files.outputs.migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: files
        run: |
          echo "dockerfile=$([ -f Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "migrations=$(compgen -G 'db/migrations/*.sql' >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"

  check-migrations:
    name: check-migrations
    needs: [detect]
    if: needs.detect.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Чистый PostgreSQL 16 на время джобы, та же версия, что в compose
    services:
      postgres:
        image: postgres:16.11
        env:
          POSTGRES_DB: dejaview_test
          POSTGRES_USER: dejaview
          POSTGRES_PASSWORD: dejaview
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dejaview -d dejaview_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply, roll back and re-apply migrations
        env:
          DATABASE_URL: postgres://dejaview:dejaview@localhost:5432/dejaview_test?sslmode=disable
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail

          # dbmate в контейнере (тот же образ, что в README): видит db/ и Postgres на localhost:5432
          dbmate() {
            docker run --rm --network host \
              -v "$GITHUB_WORKSPACE/db:/db" \
              -e DATABASE_URL \
              -e DBMATE_NO_DUMP_SCHEMA=true \
              ghcr.io/amacneil/dbmate:2.36.0 "$@"
          }
          query() { docker exec "$PG_CONTAINER" psql -U dejaview -d dejaview_test -Atc "$1"; }
          # сколько миграций записано как применённые
          applied() { query "select count(*) from schema_migrations"; }
          # сколько таблиц в схеме public, не считая служебной schema_migrations
          tables() { query "select count(*) from information_schema.tables where table_schema = 'public' and table_name <> 'schema_migrations'"; }

          echo "== Накат всех миграций"
          dbmate up
          dbmate status --exit-code

          echo "== Откат всех миграций по одной"
          while true; do
            left=$(applied)
            if [ "$left" -eq 0 ]; then break; fi
            dbmate rollback
          done

          echo "== Проверка: после отката ничего не осталось"
          left_tables=$(tables)
          if [ "$left_tables" -ne 0 ]; then
            echo "::error::После отката всех миграций в базе осталось таблиц: $left_tables"
            exit 1
          fi

          echo "== Повторный накат"
          dbmate up
          dbmate status --exit-code

  build-image:
    name: build-image
    needs: [detect, check-migrations]
    if: ${{ !cancelled() && !failure() && needs.detect.outputs.dockerfile == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=dev-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && steps.meta.outputs.tags != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && steps.meta.outputs.tags != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
